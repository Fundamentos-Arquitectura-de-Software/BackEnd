spring.application.name=Backend-FreshSense

server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST:${DB_HOST}}:${MYSQLPORT:${DB_PORT}}/${MYSQLDATABASE:${DB_NAME}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:${DB_USER}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7

server.forward-headers-strategy=framework
