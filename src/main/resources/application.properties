spring.application.name=Backend-FreshSense

server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST:${DB_HOST}}:${MYSQLPORT:${DB_PORT}}/${MYSQLDATABASE:${DB_NAME}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:${DB_USER}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP — TiDB Cloud cierra conexiones inactivas ~5min; usar maxLifetime menor
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.access.expiration.minutes=${JWT_ACCESS_MINUTES:15}
authorization.jwt.refresh.expiration.days=${JWT_REFRESH_DAYS:7}

encryption.aes.secret=${AES_SECRET:default-aes-key-change-in-production!}

server.forward-headers-strategy=framework

# URL del frontend (para redirect post-OAuth2)
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# Eureka — registro como cliente en el servidor de servicios
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Spring Cloud 2023.0.x solo soporta hasta Boot 3.3.x — desactivar el check de versión
spring.cloud.compatibility-verifier.enabled=false


