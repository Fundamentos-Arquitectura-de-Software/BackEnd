name: Trigger auto deployment for eureka-server

# Despliega eureka-server cuando cambian sus archivos (o al ejecutarlo manualmente).
on:
  push:
    branches:
      [ main ]
    paths:
    - 'eureka-server/**'
    - '.github/workflows/freshsense-eureka-server-AutoDeploy.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # requerido para el token OIDC
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FRESHSENSEBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FRESHSENSEBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FRESHSENSEBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/eureka-server
          dockerfilePath: Dockerfile
          registryUrl: freshsenseacr.azurecr.io
          registryUsername: ${{ secrets.FRESHSENSEBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FRESHSENSEBACKEND_REGISTRY_PASSWORD }}
          containerAppName: eureka-server
          resourceGroup: freshsense-rg
          imageToBuild: freshsenseacr.azurecr.io/eureka-server:${{ github.sha }}
